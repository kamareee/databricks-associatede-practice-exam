<title>DE Associate Mock Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: proctored-exam console. Question pane on the left, an OMR-style answer sheet on the right; stacks on phones. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e3e9e7; --ink:#14201e; --muted:#566562; --line:#cfd8d5;
  --accent:#0a6a62; --accent-ink:#ffffff; --accent-soft:#d6ece8;
  --flag:#a86a10; --flag-soft:#f6e7cc; --good:#1d7a3e; --good-soft:#d9efe0; --bad:#b2271d; --bad-soft:#f6dcd9;
  --code-bg:#f5f8f7;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#141e1c; --sunk:#1a2624; --ink:#e3ecea; --muted:#93a4a0; --line:#2a3836;
  --accent:#4cc0b2; --accent-ink:#06211e; --accent-soft:#15322e;
  --flag:#e3a94a; --flag-soft:#3a2b12; --good:#62c48a; --good-soft:#173322; --bad:#f08b80; --bad-soft:#3c1c19;
  --code-bg:#101917; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#141e1c; --sunk:#1a2624; --ink:#e3ecea; --muted:#93a4a0; --line:#2a3836;
  --accent:#4cc0b2; --accent-ink:#06211e; --accent-soft:#15322e;
  --flag:#e3a94a; --flag-soft:#3a2b12; --good:#62c48a; --good-soft:#173322; --bad:#f08b80; --bad-soft:#3c1c19;
  --code-bg:#101917; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:.08em .35em;border-radius:4px;word-break:break-word}
.label{font-family:var(--f-display);font-stretch:80%;font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:default}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Start ---------- */
.hero{display:grid;gap:14px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.start-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:28px}
@media (max-width:860px){.start-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.bp{width:100%;border-collapse:collapse;font-size:14px}
.bp th,.bp td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.bp th{font-family:var(--f-display);font-stretch:80%;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bp td.n{text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.bp tr:last-child td{border-bottom:none;font-weight:600}
.wbar{height:4px;background:var(--sunk);border-radius:2px;margin-top:6px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--accent)}
.modes{display:grid;gap:12px}
.mode{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px}
.mode:hover{border-color:var(--accent)}
.mode .t{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mode .t span{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.notes{display:grid;gap:10px;font-size:14px;color:var(--muted);margin:0;padding-left:18px}
.notes b{color:var(--ink);font-weight:600}
.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;margin-top:20px}
.resume p{flex:1 1 240px}
.inline-confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--flag-soft);border:1px solid var(--flag);border-radius:var(--r);padding:12px 14px;margin-top:12px}
.inline-confirm p{flex:1 1 220px;font-size:14px}

/* ---------- Exam ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.bar .name{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:15px;letter-spacing:.02em}
.bar .mode-tag{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.bar .spacer{flex:1}
.timer{font-family:var(--f-mono);font-size:18px;font-weight:500;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.prog{height:3px;background:var(--sunk)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding-top:24px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qno{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.qno span{color:var(--muted);font-weight:600}
.stem{font-size:17px;line-height:1.6;max-width:68ch}
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:16px 0 0;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;max-width:100%}
pre.code .lang{display:block;font-family:var(--f-display);font-stretch:80%;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px;margin-top:20px;max-width:76ch}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted)}
.opt .txt{min-width:0;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.locked{cursor:default}
.qnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.qnav .spacer{flex:1}
.kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.explain{margin-top:18px;border-left:3px solid var(--line);padding:4px 0 4px 16px;max-width:72ch;display:grid;gap:10px}
.explain.ok{border-color:var(--good)} .explain.no{border-color:var(--bad)}
.explain .verdict{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:16px}
.explain.ok .verdict{color:var(--good)} .explain.no .verdict{color:var(--bad)}
.refs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.objective{font-size:13px;color:var(--muted)}

/* answer sheet */
.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
@media (max-width:900px){.sheet{position:static}}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 6px}
@media (max-width:900px){.grid{grid-template-columns:repeat(9,minmax(0,1fr))}}
@media (max-width:460px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.cell{position:relative;aspect-ratio:1;max-width:44px;width:100%;justify-self:center;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cell.cur{outline:2px solid var(--accent);outline-offset:2px}
.cell.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--flag);border:2px solid var(--surface)}
.cell.r-ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.cell.r-no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.cell.r-skip{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .l-ans{background:var(--ink);border-color:var(--ink)} .legend .l-flag{background:var(--flag);border-color:var(--flag)}
.sheet .btn{width:100%;justify-content:center;margin-top:14px}

/* ---------- Results ---------- */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding-block:8px 24px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.score{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:clamp(64px,12vw,112px);line-height:.9;letter-spacing:-.02em}
.big small{font-size:.32em;font-stretch:85%;color:var(--muted);font-weight:700;letter-spacing:0;margin-left:6px}
.verdict-pill{display:inline-block;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.verdict-pill.ok{background:var(--good-soft);color:var(--good)} .verdict-pill.no{background:var(--bad-soft);color:var(--bad)}
.sec-list{display:grid;gap:14px;margin-top:8px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:14px;align-items:center;font-size:14px}
@media (max-width:560px){.sec{grid-template-columns:minmax(0,1fr) 64px}.sec .track{grid-column:1/-1;order:3}}
.track{position:relative;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.track b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);margin-bottom:10px}
.rv summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.rv summary::-webkit-details-marker{display:none}
.rv .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--surface)}
.rv .mark.ok{background:var(--good)} .rv .mark.no{background:var(--bad)} .rv .mark.skip{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.rv .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.rv .sec-tag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.rv .body{padding:4px 16px 18px 70px;display:grid;gap:4px}
@media (max-width:560px){.rv .body{padding-left:16px}.rv summary{grid-template-columns:36px minmax(0,1fr)}.rv .sec-tag{display:none}}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
const BANK = [{"d": 3, "obj": "Union and union all", "q": "Two DataFrames hold the same columns (`id`, `amount`, `currency`), but `df_b` lists them in the order `currency`, `id`, `amount`. After `df_a.union(df_b)`, currency codes appear in the `id` column. Which operation combines them correctly and keeps duplicate rows?", "opts": ["`df_a.unionAll(df_b)`", "`df_a.unionByName(df_b)`", "`df_a.union(df_b).distinct()`", "`df_a.join(df_b, how=\"outer\")`"], "a": 1, "why": "`union` and its alias `unionAll` match columns by position, which caused the misalignment; both keep duplicates (like SQL `UNION ALL`). `unionByName` matches by column name and also keeps duplicates. Adding `distinct()` removes duplicates (like SQL `UNION`) and doesn't fix the alignment. An outer join is not a union.", "refs": [["DataFrame.unionByName", "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.unionByName.html"]], "id": 0}, {"d": 4, "obj": "Common task types and dependencies", "q": "A job must ingest data with a notebook, then refresh a Lakeflow Spark Declarative Pipeline, then refresh an AI/BI dashboard, each step starting only after the previous one succeeds. How should the job be built?", "opts": ["One notebook task that calls the pipeline and dashboard REST APIs in sequence", "A notebook task, then a pipeline task, then a dashboard task, each depending on the one before", "Three separate jobs on schedules staggered 30 minutes apart", "A notebook task, then a Run Job task, then a SQL query task that sleeps for 30 minutes"], "a": 1, "why": "Native pipeline and dashboard task types, chained with dependencies in the DAG, give each step its own status, retries and lineage. Calling APIs from a notebook hides the steps from the job view. Staggered schedules guess at durations and break when a step runs long.", "refs": [["Lakeflow Jobs", "https://docs.databricks.com/aws/en/jobs/"]], "id": 1}, {"d": 2, "obj": "Batch, streaming and incremental ingestion of semi-structured data", "q": "New JSON event files arrive continuously in `/Volumes/main/raw/events/`. In Databricks SQL, the engineer wants a bronze table that processes only files it hasn't seen before each time it is refreshed. Which statement achieves this?", "opts": ["`CREATE OR REFRESH STREAMING TABLE bronze_events AS SELECT * FROM STREAM read_files('/Volumes/main/raw/events/', format => 'json')`", "`CREATE MATERIALIZED VIEW bronze_events AS SELECT * FROM read_files('/Volumes/main/raw/events/', format => 'json')`", "`CREATE TABLE bronze_events AS SELECT * FROM read_files('/Volumes/main/raw/events/', format => 'json')`", "`CREATE VIEW bronze_events AS SELECT * FROM read_files('/Volumes/main/raw/events/', format => 'json')`"], "a": 0, "why": "A streaming table over `STREAM read_files(...)` uses Auto Loader underneath and keeps track of which files it has processed, so each refresh reads only new files. A materialized view recomputes from the full source when it can't refresh incrementally, CTAS is a one-off load, and a view re-reads every file on every query.", "refs": [["Standard connectors in Lakeflow Connect", "https://docs.databricks.com/aws/en/ingestion/"]], "id": 2}, {"d": 7, "obj": "Convert between managed and external tables", "q": "`main.sales.orders` is a Unity Catalog external table. The team wants it to become a managed table so it benefits from predictive optimization, while keeping the same name and table history with minimal downtime. What should they run?", "opts": ["`CREATE TABLE main.sales.orders_m DEEP CLONE main.sales.orders`, then drop the original", "`ALTER TABLE main.sales.orders SET MANAGED`", "`ALTER TABLE main.sales.orders SET TBLPROPERTIES ('table_type' = 'MANAGED')`", "`CONVERT TO DELTA main.sales.orders`"], "a": 1, "why": "`ALTER TABLE ... SET MANAGED` converts an external table to a managed one in place, keeping its name and history (`UNSET MANAGED` rolls it back within a limited window). A deep clone creates a new table with a new name and a fresh history. Table type isn't a writable table property, and `CONVERT TO DELTA` converts Parquet files to Delta.", "refs": [["Convert external tables to managed", "https://docs.databricks.com/aws/en/tables/convert-external-managed"]], "id": 3}, {"d": 5, "obj": "Deploy bundles across dev, test and prod", "q": "After `databricks bundle deploy -t prod`, the production job's name starts with `[dev ` followed by the deployer's user name, and its schedule is paused. What is the most likely cause?", "opts": ["A workspace admin paused all job schedules; resume them in the UI", "The prod target is configured with `mode: development`; it should use `mode: production`", "The CLI was run without `--force`", "Bundles always pause schedules on first deployment until `databricks bundle run` is executed"], "a": 1, "why": "`mode: development` prefixes resource names with a development identifier and pauses schedules and triggers on deployed jobs. `mode: production` keeps names and schedules as defined and adds production checks such as run-as identity and deployment path. Neither `--force` nor a first deploy causes this.", "refs": [["Bundle deployment modes", "https://docs.databricks.com/dev-tools/bundles/deployment-modes"]], "id": 4}, {"d": 5, "obj": "Bundle variables and target overrides", "q": "A bundle defines the variable below, and the prod target overrides it. How should a job parameter in `resources/ingest_job.yml` reference the variable so it resolves to `dev` or `prod` depending on the target?", "code": "variables:\n  catalog:\n    description: Target catalog\n    default: dev\n\ntargets:\n  dev:\n    default: true\n  prod:\n    variables:\n      catalog: prod", "lang": "yaml", "opts": ["`{{var.catalog}}`", "`${var.catalog}`", "`${vars.catalog}`", "`$(catalog)`"], "a": 1, "why": "Bundle custom variables are referenced as `${var.<name>}`. A target's `variables` mapping overrides the default, and values can also be set with `--var=\"catalog=...\"` or a `BUNDLE_VAR_catalog` environment variable. Double braces are the syntax for job dynamic value references, not bundle variables.", "refs": [["Bundle custom variables", "https://docs.databricks.com/aws/en/dev-tools/bundles/variables"]], "id": 5}, {"d": 4, "obj": "Time-based vs data-driven triggers", "q": "A vendor drops files into a Unity Catalog external location a few times a day at unpredictable times. Each delivery must be processed within minutes, and the team doesn't want to pay for compute that sits idle between deliveries. Which design fits?", "opts": ["A file arrival trigger on the location, with the job running Auto Loader using `availableNow`", "A continuous job running Auto Loader with a processing-time trigger", "A job scheduled to run every minute", "A table update trigger on the bronze table"], "a": 0, "why": "A file arrival trigger starts the job only when new files land in the monitored location, and `availableNow` processes everything new and then stops, so no compute idles between deliveries. A continuous stream or a once-a-minute schedule keeps paying when nothing has arrived. A table update trigger on bronze would wait for the very load it is supposed to start.", "refs": [["Schedules and triggers", "https://docs.databricks.com/aws/en/jobs/triggers"], ["File arrival triggers", "https://docs.databricks.com/aws/en/jobs/file-arrival-triggers"]], "id": 6}, {"d": 3, "obj": "Data quality checks and validation rules", "q": "In a Lakeflow Spark Declarative Pipeline, rows with a non-positive `amount` must be kept out of the silver table. The pipeline must keep running, and the number of rejected rows must be visible in pipeline metrics. Which definition meets these requirements?", "opts": ["`CONSTRAINT valid_amount EXPECT (amount > 0) ON VIOLATION DROP ROW`", "`CONSTRAINT valid_amount EXPECT (amount > 0)`", "`CONSTRAINT valid_amount EXPECT (amount > 0) ON VIOLATION FAIL UPDATE`", "`ALTER TABLE silver.payments ADD CONSTRAINT valid_amount CHECK (amount > 0)`"], "a": 0, "why": "`ON VIOLATION DROP ROW` removes failing rows and records the count in the pipeline's data quality metrics. With no `ON VIOLATION` clause the rows are kept and only counted. `FAIL UPDATE` stops the update. A Delta `CHECK` constraint makes the whole write fail when any row violates it.", "refs": [["Lakeflow Spark Declarative Pipelines", "https://docs.databricks.com/aws/en/ldp/"]], "id": 7}, {"d": 3, "obj": "Split columns and explode arrays", "q": "Column `tags` holds comma-separated strings such as `'red,large,sale'`. The engineer needs one output row per tag. Which expression produces that?", "opts": ["`df.withColumn(\"tag\", F.split(\"tags\", \",\"))`", "`df.withColumn(\"tag\", F.explode(\"tags\"))`", "`df.withColumn(\"tag\", F.explode(F.split(\"tags\", \",\")))`", "`df.withColumn(\"tag\", F.flatten(F.split(\"tags\", \",\")))`"], "a": 2, "why": "`split` turns the string into an array, and `explode` emits one row per array element. `split` alone keeps one row with an array value. `explode` on a string column fails because it needs an array or map. `flatten` merges nested arrays into one array and doesn't create rows.", "refs": [["pyspark.sql.functions.explode", "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.explode.html"]], "id": 8}, {"d": 1, "obj": "Select compute by characteristics, limitations and cost model", "q": "Twenty analysts run ad hoc SQL against curated gold tables during business hours, and nobody queries overnight. They need near-instant startup, automatic scaling when many queries arrive at once, and no cost while idle. What should the data engineer provision?", "opts": ["An all-purpose cluster with eight fixed workers that stays running", "Jobs compute created for each analyst query", "A serverless SQL warehouse with auto-stop configured", "A single-node all-purpose cluster for each analyst"], "a": 2, "why": "Serverless SQL warehouses start in seconds, scale out by adding clusters as concurrency rises, and auto-stop when idle so overnight hours cost nothing. A fixed all-purpose cluster bills while idle and doesn't scale for concurrency. Jobs compute is for scheduled or triggered workloads, not interactive queries. Per-analyst single-node clusters multiply cost and still have startup time. (The official sample uses the legacy term \"high-concurrency cluster\" for this scenario; expect either wording.)", "refs": [["Serverless compute limitations", "https://docs.databricks.com/aws/en/compute/serverless/limitations"]], "id": 9}, {"d": 3, "obj": "Aggregations: count, approximate count distinct, mean, summary", "q": "A dashboard shows daily unique users over a 30-billion-row clickstream table. Exact counts are too slow, and product managers accept about 5% error. Which aggregation fits?", "opts": ["`F.countDistinct(\"user_id\")`", "`F.count(\"user_id\")`", "`len(df.select(\"user_id\").distinct().collect())`", "`F.approx_count_distinct(\"user_id\", rsd=0.05)`"], "a": 3, "why": "`approx_count_distinct` uses HyperLogLog++ with a configurable maximum relative standard deviation (`rsd`), trading a bounded error for far less memory and shuffle. `countDistinct` is exact and expensive. `count` counts non-null values, not distinct ones. Collecting distinct IDs to the driver risks driver out-of-memory errors.", "refs": [["approx_count_distinct", "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.approx_count_distinct.html"]], "id": 10}, {"d": 3, "obj": "Clean bronze data into silver with PySpark", "q": "`main.bronze.orders` has string columns `order_id`, `channel` and `order_ts`. The silver table must exclude rows with a null `order_id`, replace null `channel` values with `'unknown'`, and store `order_ts` as a DATE column named `order_date`. Which code meets all three requirements? (`F` is `pyspark.sql.functions`.)", "opts": ["`spark.read.table(\"main.bronze.orders\").dropna(how=\"all\").fillna({\"channel\": \"unknown\"}).withColumn(\"order_date\", F.to_date(\"order_ts\"))`", "`spark.read.table(\"main.bronze.orders\").fillna(\"unknown\").dropna(subset=[\"order_id\"]).withColumn(\"order_date\", F.to_date(\"order_ts\"))`", "`spark.read.table(\"main.bronze.orders\").dropna(subset=[\"order_id\"]).fillna({\"channel\": \"unknown\"}).withColumnRenamed(\"order_ts\", \"order_date\")`", "`spark.read.table(\"main.bronze.orders\").dropna(subset=[\"order_id\"]).fillna({\"channel\": \"unknown\"}).withColumn(\"order_date\", F.to_date(\"order_ts\"))`"], "a": 3, "why": "`dropna(subset=[\"order_id\"])` removes only rows where the key is null, the dict form of `fillna` targets one column, and `to_date` changes the type. `dropna(how=\"all\")` drops a row only when every column is null. `fillna(\"unknown\")` fills every string column, so null `order_id`s become `'unknown'` before the drop and survive. `withColumnRenamed` changes the name but leaves the type as string.", "refs": [["PySpark DataFrame API", "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/dataframe.html"]], "id": 11}, {"d": 4, "obj": "Control flow: looping", "q": "The same ingestion notebook must run for each of 12 region codes. Each region should retry on its own, show up separately in the run view, and no more than four regions should run at once. Which design meets this?", "opts": ["Twelve copies of the notebook task in one job, each with a hard-coded region parameter", "Twelve separate jobs, started in parallel by a parent job's Run Job tasks", "A Python `for` loop over the regions inside one notebook task, with try/except per region", "A For each task over the 12 region codes, with a nested parameterised notebook task and concurrency 4"], "a": 3, "why": "A For each task runs its nested task once per input, with configurable concurrency, and each iteration has its own status and retries. Twelve copied tasks or twelve jobs duplicate configuration and drift. A loop inside one notebook hides per-region status and retries the whole notebook when one region fails.", "refs": [["Lakeflow Jobs", "https://docs.databricks.com/aws/en/jobs/"]], "id": 12}, {"d": 5, "obj": "Git folders: branches, commits, pull requests", "q": "Two engineers work in one shared Git folder. When one switches branches, the other's notebooks change underneath them. What is the recommended way to work?", "opts": ["Each engineer uses a personal Git folder and a feature branch, then commits, pushes and opens a pull request", "Keep the shared Git folder and agree in chat before anyone switches branches", "Turn off the Git integration and rely on notebook revision history for versioning", "Export notebooks as archives and merge changes by hand before importing them again"], "a": 0, "why": "A Git folder has one checked-out branch for everyone who uses it, so switching affects all of them. Databricks recommends a personal Git folder per developer, a feature branch for each change, and review through pull requests in the Git provider. Revision history and exported archives give no branching or review.", "refs": [["Git folders", "https://docs.databricks.com/aws/en/repos/"]], "id": 13}, {"d": 3, "obj": "Joins on multiple keys", "q": "Every order must appear in the result, with customer attributes attached where a customer matches on both `customer_id` and `region`. Orders with no matching customer must still appear, with null customer columns. Which join is correct?", "opts": ["`orders.join(customers, on=[\"customer_id\", \"region\"], how=\"left\")`", "`orders.join(customers, on=[\"customer_id\", \"region\"], how=\"inner\")`", "`orders.join(customers, on=\"customer_id\", how=\"left\").filter(\"region IS NOT NULL\")`", "`orders.crossJoin(customers).where(\"orders.customer_id = customers.customer_id\")`"], "a": 0, "why": "A left join on both keys keeps every row from `orders` and fills customer columns with nulls when there is no match. An inner join drops unmatched orders. Joining on one key matches customers from other regions, and the filter then removes unmatched rows. A cross join with a filter behaves like an inner join on one key and is far more expensive.", "refs": [["DataFrame.join", "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.join.html"]], "id": 14}, {"d": 1, "obj": "Select compute by characteristics, limitations and cost model", "q": "A nightly batch job runs a legacy Python notebook that uses the Spark RDD API and depends on a compute-scoped init script that installs a native library. The team wants the lowest cost per run and no long-lived compute. Which compute should run the job?", "opts": ["Serverless compute for jobs, because it starts fastest and needs no configuration", "The analytics team's existing all-purpose cluster, attached to the job task", "A serverless SQL warehouse running the notebook as a SQL task", "A classic jobs compute cluster created for each run, with the init script attached"], "a": 3, "why": "Serverless notebooks and jobs support only Spark Connect APIs (no RDD API) and do not support compute-scoped init scripts, so the workload cannot move to serverless without a rewrite. Classic jobs compute is billed at the jobs rate (lower than all-purpose) and terminates when the run ends. An all-purpose cluster costs more per DBU and is shared, interactive compute. A SQL warehouse runs SQL only.", "refs": [["Serverless compute limitations", "https://docs.databricks.com/aws/en/compute/serverless/limitations"]], "id": 15}, {"d": 2, "obj": "Auto Loader schema enforcement and evolution", "q": "An Auto Loader stream runs in a Lakeflow Jobs task with `cloudFiles.schemaLocation` set, no schema supplied, and `trigger(availableNow=True)`. A new batch adds a column `marketing_opt_in`. The run fails with `UnknownFieldException`; a manual rerun succeeds and the column appears in the bronze table. What explains this, and what should the engineer change?", "opts": ["Expected in the default `addNewColumns` mode; add task retries so the restart is automatic", "Schema inference is broken; set `cloudFiles.inferColumnTypes` to `false` and rerun", "The checkpoint is corrupted; delete it so the stream restarts cleanly from scratch", "The new column was written to `_rescued_data`, and the rerun merged it into the schema"], "a": 0, "why": "With no schema provided, `addNewColumns` is the default mode. When Auto Loader sees a new column it records the updated schema in the schema location and stops the stream with `UnknownFieldException`; the next start picks up the new column. Databricks recommends running such streams in jobs with retries. Deleting the checkpoint would reprocess every file. `_rescued_data` is used for new columns only in `rescue` mode.", "refs": [["Auto Loader schema inference and evolution", "https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema"]], "id": 16}, {"d": 7, "obj": "Row-level security", "q": "The function below exists. Analysts must see only APAC rows of `main.sales.orders` (column `region`) whenever they query the table, while admins see everything. Which statement enforces this on the table itself?", "code": "CREATE FUNCTION main.sec.region_filter(region STRING)\nRETURN is_account_group_member('admins') OR region = 'APAC';", "lang": "sql", "opts": ["`ALTER TABLE main.sales.orders ADD CONSTRAINT region_filter CHECK (main.sec.region_filter(region))`", "`ALTER TABLE main.sales.orders SET ROW FILTER main.sec.region_filter ON (region)`", "`GRANT SELECT ON TABLE main.sales.orders TO analysts WHERE main.sec.region_filter(region)`", "`CREATE VIEW main.sales.orders_apac AS SELECT * FROM main.sales.orders WHERE region = 'APAC'` and grant only the view"], "a": 1, "why": "`SET ROW FILTER ... ON (column)` attaches the function to the table, and Unity Catalog applies it to every query. A `CHECK` constraint validates writes and doesn't filter reads. `GRANT` has no `WHERE` clause. A filtered view works only as long as nobody has access to the base table, and it doesn't protect the table itself.", "refs": [["ALTER TABLE", "https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-alter-table"]], "id": 17}, {"d": 4, "obj": "Task dependencies in the DAG", "q": "Task `cleanup_staging` depends on three upstream tasks. It must run after all three have finished, whether they succeeded or failed. Which Run if condition should it use?", "opts": ["All succeeded", "At least one failed", "All done", "None failed"], "a": 2, "why": "\"All done\" runs the task once every dependency has completed, regardless of outcome, which suits cleanup work. \"All succeeded\" is the default and skips cleanup when anything fails. \"At least one failed\" runs only on failure, and \"None failed\" runs only when no dependency failed.", "refs": [["Lakeflow Jobs", "https://docs.databricks.com/aws/en/jobs/"]], "id": 18}, {"d": 6, "obj": "Job statuses and DAG upstream blockers", "q": "In a job run's graph view, task `publish_gold` shows the status \"Upstream failed\". What does this mean?", "opts": ["It did not run because a task it depends on failed; open that upstream task", "`publish_gold` itself contains a bug; open its output to see the stack trace", "`publish_gold` ran longer than its configured timeout and was stopped", "Someone cancelled the run manually before `publish_gold` started"], "a": 0, "why": "\"Upstream failed\" marks a task that was not run because one of its dependencies failed. It has no output of its own; the root cause is in the failed upstream task, which the graph view highlights. Timeouts and cancellations show their own statuses.", "refs": [["Lakeflow Jobs", "https://docs.databricks.com/aws/en/jobs/"]], "id": 19}, {"d": 7, "obj": "GRANT, REVOKE and DENY", "q": "Group `analysts` has `SELECT` on schema `main.hr`, which contains six tables. They must lose access to `main.hr.salaries` only. Which approach works in Unity Catalog?", "opts": ["`DENY SELECT ON TABLE main.hr.salaries TO analysts`, which overrides the schema grant", "`REVOKE SELECT ON TABLE main.hr.salaries FROM analysts`, keeping the schema grant", "Revoke `USE CATALOG` on `main` from `analysts` until the table is moved", "Revoke `SELECT` on the schema and grant it on the five other tables (or move `salaries`)"], "a": 3, "why": "Privileges granted on a schema are inherited by every table in it. Revoking at table level removes nothing, because no table-level grant exists. The SQL `DENY` statement applies only to legacy `hive_metastore` objects, not Unity Catalog securables. Unity Catalog's ABAC DENY policies are in Beta and, per current docs, cover only the MANAGE ACCESS CONTROL privilege. Revoking `USE CATALOG` cuts off the whole catalog. The guide lists DENY as an objective, so expect it framed as legacy or ABAC behaviour.", "refs": [["DENY (hive_metastore only)", "https://learn.microsoft.com/azure/databricks/sql/language-manual/security-deny"], ["ABAC DENY policies (Beta)", "https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/deny-policies"]], "id": 20}, {"d": 2, "obj": "COPY INTO with schema evolution", "q": "Later invoice files from the same source contain a new column, `tax_code`. The data engineer wants the target table `main.bronze.invoices` to gain this column automatically on the next COPY INTO run. Which addition makes that happen?", "opts": ["`COPY_OPTIONS ('mergeSchema' = 'true')`", "`FORMAT_OPTIONS ('inferSchema' = 'true')`", "`COPY_OPTIONS ('force' = 'true')`", "`PATTERN = '*.csv'`"], "a": 0, "why": "`mergeSchema` in `COPY_OPTIONS` lets the target table's schema evolve to match incoming data. (`mergeSchema` in `FORMAT_OPTIONS` merges schemas across the source files being read; the two are often set together.) `inferSchema` only affects type inference, `force` reloads already-loaded files, and `PATTERN` filters file names.", "refs": [["COPY INTO", "https://docs.databricks.com/aws/en/sql/language-manual/delta-copy-into"]], "id": 21}, {"d": 4, "obj": "Control flow: conditional branching", "q": "Task `check_new_rows` runs `dbutils.jobs.taskValues.set(key=\"new_rows\", value=n)`. The expensive task `rebuild_gold` must run only when `n` is greater than zero, and the job run should still succeed when there is nothing to do. How should the engineer configure this?", "opts": ["Set `rebuild_gold`'s Run if condition to \"At least one succeeded\" so it follows the check's result", "Put `rebuild_gold` inside a For each task that iterates over the `new_rows` task value", "Raise an exception in `check_new_rows` when `n` is 0, so that `rebuild_gold` is skipped automatically", "Add an If/else condition task on `{{tasks.check_new_rows.values.new_rows}} > 0`; put `rebuild_gold` on its true branch"], "a": 3, "why": "An If/else condition task compares values, including task values passed as dynamic value references, and routes execution to its true or false branch while the run still succeeds. Run if conditions look only at dependency outcomes, not data. For each needs a list of inputs. Raising an exception marks the run as failed, which pollutes alerting and the run history.", "refs": [["Lakeflow Jobs", "https://docs.databricks.com/aws/en/jobs/"]], "id": 22}, {"d": 6, "obj": "Spark UI: skew, shuffle and disk spill", "q": "An aggregation stage shuffles about 1.5 TB across 200 shuffle partitions. Task durations are even (median close to max), and the stage reports roughly 300 GB of memory spill and 60 GB of disk spill. Which change addresses the spill?", "opts": ["Salt the grouping key so rows spread across more tasks", "Broadcast the aggregation's input to every executor", "Increase the number of shuffle partitions so each task handles less data", "Reduce `spark.sql.shuffle.partitions` to 50 to cut task overhead"], "a": 2, "why": "Even task durations rule out skew; each of the 200 partitions holds about 7.5 GB, which doesn't fit in execution memory, so tasks spill. More, smaller partitions fix that. Salting addresses skew, which isn't present. Broadcasting applies to joins, not aggregations of a large input. Fewer partitions make each one bigger and the spill worse. (Compare the official sample, where one task with a much larger max shuffle read signals skew.)", "refs": [["Spark SQL performance tuning", "https://spark.apache.org/docs/latest/sql-performance-tuning.html"]], "id": 23}, {"d": 2, "obj": "Land REST/JDBC data in cloud storage governed by Unity Catalog", "q": "A notebook calls a partner REST API every hour and needs to land the raw JSON responses as files, so a downstream Auto Loader stream can ingest them. The files must be governed by Unity Catalog and the task runs on serverless compute. Where should the notebook write the files?", "opts": ["To `/tmp` on the driver, then move them in a follow-up task", "To the DBFS root at `dbfs:/FileStore/partner_api/`", "To a Unity Catalog volume path such as `/Volumes/main/landing/partner_api/`", "Into the notebook's workspace folder next to the code"], "a": 2, "why": "Unity Catalog volumes govern non-tabular files with the same grants and lineage as tables, and serverless compute is designed to use volumes for file storage. DBFS access is limited on serverless and isn't governed by Unity Catalog. Driver-local `/tmp` disappears with the compute. Workspace folders are for code and small files, not a data landing zone.", "refs": [["Serverless data access (use volumes)", "https://docs.databricks.com/aws/en/compute/serverless/limitations"], ["Volumes", "https://docs.databricks.com/aws/en/volumes"]], "id": 24}, {"d": 7, "obj": "Column-level masking", "q": "The mask below is applied to `main.crm.customers.email`. A user who belongs to `analysts` but not to `pii_readers` runs `SELECT email FROM main.crm.customers` for a row whose stored value is `jo@acme.com`. What does the user see?", "code": "CREATE FUNCTION main.sec.mask_email(email STRING)\nRETURN CASE WHEN is_account_group_member('pii_readers') THEN email\n            ELSE regexp_replace(email, '^[^@]+', '***') END;\n\nALTER TABLE main.crm.customers ALTER COLUMN email SET MASK main.sec.mask_email;", "lang": "sql", "opts": ["`jo@acme.com`, because masks apply only to users without `SELECT`", "`NULL`", "A permission error", "`***@acme.com`"], "a": 3, "why": "A column mask runs for every query that reads the column. The user isn't in `pii_readers`, so the `ELSE` branch replaces the local part of the address. Masks don't depend on `SELECT` (the user needs `SELECT` to query at all), they don't return NULL unless the function does, and they don't raise errors.", "refs": [["ALTER TABLE", "https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-alter-table"]], "id": 25}, {"d": 2, "obj": "COPY INTO from cloud object storage", "q": "The following statement loaded 12,400 rows on its first run. An hour later, with no new files in the folder, a colleague runs exactly the same statement again. What happens?", "code": "COPY INTO main.bronze.invoices\nFROM '/Volumes/main/landing/finance/invoices/'\nFILEFORMAT = CSV\nFORMAT_OPTIONS ('header' = 'true');", "lang": "sql", "opts": ["It loads 12,400 duplicate rows, because COPY INTO reads every file in the path on each run", "It fails, because the target table already contains data", "It replaces the table contents with the current files", "It loads 0 rows, because COPY INTO skips files it has already loaded into this table"], "a": 3, "why": "COPY INTO is idempotent: the target table tracks which source files it has already loaded, and reruns skip them. To deliberately reload files, set `COPY_OPTIONS ('force' = 'true')`. It never overwrites the table and doesn't fail on a non-empty target.", "refs": [["COPY INTO", "https://docs.databricks.com/aws/en/sql/language-manual/delta-copy-into"]], "id": 26}, {"d": 2, "obj": "Auto Loader schema enforcement and evolution", "q": "A bronze table feeds downstream contracts, so its schema must not change when the source adds fields. However, values in unexpected new fields must not be lost. Which Auto Loader setting meets both requirements?", "opts": ["`cloudFiles.schemaEvolutionMode = \"rescue\"`", "`cloudFiles.schemaEvolutionMode = \"addNewColumns\"`", "`cloudFiles.schemaEvolutionMode = \"failOnNewColumns\"`", "`cloudFiles.schemaEvolutionMode = \"none\"`"], "a": 0, "why": "`rescue` never evolves the schema and records new columns in the rescued data column (`_rescued_data`), so nothing is lost. `addNewColumns` changes the schema, `failOnNewColumns` stops the stream until someone intervenes, and `none` ignores new columns (data is not rescued unless `rescuedDataColumn` is set separately).", "refs": [["Auto Loader schema inference and evolution", "https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema"]], "id": 27}, {"d": 2, "obj": "Auto Loader file discovery modes", "q": "A landing location receives about two million small JSON files per day in deeply nested date folders. Auto Loader runs in directory listing mode, and most of each run is spent listing files rather than processing them. Which change addresses the bottleneck?", "opts": ["Replace Auto Loader with COPY INTO, which tracks loaded files and avoids re-listing the directory", "Switch to file notification mode so new files are discovered from storage events", "Lower `cloudFiles.maxFilesPerTrigger` to 100 so each micro-batch lists fewer files", "Use `trigger(processingTime=\"10 seconds\")` so each listing covers a shorter window"], "a": 1, "why": "File notification mode (and the newer managed file events on external locations) subscribes to storage events, so discovery cost no longer grows with the size of the directory tree. COPY INTO also lists the source and is aimed at thousands, not millions, of files. Rate limits and trigger intervals change batch size, not discovery cost; processing-time triggers also aren't supported on serverless jobs.", "refs": [["Auto Loader schema inference and evolution", "https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema"], ["Serverless streaming triggers", "https://docs.databricks.com/aws/en/compute/serverless/limitations"]], "id": 28}, {"d": 4, "obj": "Trigger types: table update", "q": "A gold job joins three silver tables that three different teams refresh at unpredictable times. The job should run once after all three tables have been updated, without a continuously running cluster. Which trigger fits?", "opts": ["A scheduled trigger at 06:00 every day", "A table update trigger on the three tables, set to trigger when any table is updated", "A table update trigger on the three tables, set to trigger when all tables are updated", "A file arrival trigger on the storage location of the three tables"], "a": 2, "why": "Table update triggers watch Unity Catalog tables and can fire when any or all of the monitored tables change; \"all\" matches this dependency. \"Any\" would run up to three times with partially refreshed inputs. A fixed schedule may run before the data is ready. File arrival triggers watch for new files in a storage location, not Delta commits to tables.", "refs": [["Trigger jobs when source tables are updated", "https://docs.databricks.com/aws/en/jobs/trigger-table-update"]], "id": 29}, {"d": 2, "obj": "Choose between Auto Loader, Lakeflow Connect and other methods", "q": "Sales operations wants Salesforce Accounts and Opportunities in the lakehouse, refreshed incrementally several times a day, governed in Unity Catalog, with as little custom code as possible and without hand-managing API rate limits. Which approach fits best?", "opts": ["A notebook that calls the Salesforce REST API, stores a watermark in a Delta table, and runs on a Lakeflow Jobs schedule", "A Lakehouse Federation connection to Salesforce, with dashboards querying the foreign tables directly", "A nightly CSV export from Salesforce loaded with Auto Loader", "A Lakeflow Connect managed Salesforce connector that writes to Unity Catalog streaming tables on a schedule"], "a": 3, "why": "Managed connectors in Lakeflow Connect handle incremental reads, schema changes and source API limits, and land data in Unity Catalog tables with minimal code. A custom REST notebook works but you own watermarking, retries and rate limits. Lakehouse Federation queries the source in place rather than ingesting it. A nightly export misses the several-times-a-day requirement and adds manual steps.", "refs": [["Managed connectors in Lakeflow Connect", "https://docs.databricks.com/en/ingestion/lakeflow-connect/index.html"]], "id": 30}, {"d": 2, "obj": "JDBC/ODBC or REST clients in notebooks", "q": "A notebook reads an 80-million-row PostgreSQL table with the code below. The Spark UI shows a single task doing all the reading. Which change parallelises the read?", "code": "df = (spark.read.format(\"jdbc\")\n  .option(\"url\", jdbc_url)\n  .option(\"dbtable\", \"public.transactions\")\n  .option(\"user\", dbutils.secrets.get(\"pg\", \"user\"))\n  .option(\"password\", dbutils.secrets.get(\"pg\", \"password\"))\n  .load())", "lang": "python", "opts": ["Add `partitionColumn`, `lowerBound`, `upperBound` and `numPartitions` on a numeric key", "Add `.option(\"fetchsize\", \"1\")` so rows stream to the executor one at a time", "Call `df.repartition(64)` immediately after `.load()` to spread the read", "Set `spark.sql.shuffle.partitions` to 64 before running the read"], "a": 0, "why": "Without partitioning options, the JDBC source issues one query from one task. `partitionColumn` with bounds and `numPartitions` splits the read into parallel range queries. `repartition` after the load only redistributes data that was already read serially, `shuffle.partitions` affects later shuffles, and a tiny fetch size makes the single read slower.", "refs": [["Query databases using JDBC", "https://docs.databricks.com/aws/en/connect/external-systems/jdbc"]], "id": 31}, {"d": 6, "obj": "Liquid clustering and predictive optimization", "q": "Which statement about automatic liquid clustering (`CLUSTER BY AUTO`) is accurate?", "opts": ["On Unity Catalog managed tables, predictive optimization picks and evolves the keys from query patterns", "It works on any external Parquet table registered in Unity Catalog", "It can be combined with `PARTITIONED BY` on the same table for the best results", "After enabling it, `OPTIMIZE ... ZORDER BY` must still run as a nightly job"], "a": 0, "why": "Automatic liquid clustering is available for Unity Catalog managed tables and needs predictive optimization, which analyses query predicates and runs the clustering as background maintenance. Liquid clustering replaces partitioning and Z-ordering, so it isn't combined with them. Parquet tables aren't Delta tables.", "refs": [["Use liquid clustering", "https://docs.databricks.com/aws/en/delta/clustering"]], "id": 32}, {"d": 1, "obj": "Core components: Delta Lake and Unity Catalog", "q": "A team stores Parquet files in cloud object storage. Two concurrent writers recently left a folder half-written, auditors want to query the data as it was yesterday, and three workspaces need the same access rules and lineage. Which combination addresses all three requirements?", "opts": ["Photon-accelerated Parquet tables registered in each workspace's Hive metastore", "Keep Parquet, write each batch to a new folder, and control access with per-workspace cloud IAM roles", "Delta Lake tables governed by Unity Catalog", "Files in the DBFS root, protected by workspace folder permissions"], "a": 2, "why": "Delta Lake's transaction log gives atomic commits (no half-written results visible to readers) and time travel (`VERSION AS OF` / `TIMESTAMP AS OF`). Unity Catalog is account-level, so one set of grants and lineage applies across every workspace attached to the metastore. Photon is a query engine and adds no transactional guarantees; the Hive metastore is per workspace. IAM roles and DBFS folder permissions give coarse, file-level control without lineage.", "refs": [["Lakehouse platform overview", "https://docs.databricks.com/aws/en/introduction/"]], "id": 33}, {"d": 4, "obj": "Control flow: retries", "q": "A task calls a partner API that returns HTTP 503 in roughly one run out of twenty. A manual rerun a few minutes later always succeeds. How should the job be configured to stop needing manual intervention?", "opts": ["Switch the job to a continuous trigger so a new run starts after a failure", "Set the task's Run if condition to \"All done\" so it always runs", "Set a five-minute timeout so failed calls end sooner", "Configure task retries with an interval between attempts"], "a": 3, "why": "Task-level retries (maximum retries plus a minimum interval between attempts) handle transient failures automatically. A continuous trigger starts new runs but doesn't retry the failed task inside one. Run if conditions control whether a task runs based on its dependencies. A timeout ends long attempts and doesn't retry them.", "refs": [["Lakeflow Jobs", "https://docs.databricks.com/aws/en/jobs/"]], "id": 34}, {"d": 3, "obj": "Basic tuning parameters, then re-measure", "q": "On a 16-core classic cluster, a job aggregates about 3 GB. Adaptive query execution has been disabled by a legacy setting. The Spark UI shows each shuffle stage running 200 tasks that finish in about 40 ms on a few megabytes each. Which change should the engineer try first, before re-measuring?", "opts": ["Raise `spark.default.parallelism` to 400 to spread the work further", "Lower `spark.sql.shuffle.partitions`, or re-enable AQE coalescing", "Increase `spark.driver.memory` so the driver schedules tasks faster", "Set `spark.sql.autoBroadcastJoinThreshold` to `-1` to avoid broadcasts"], "a": 1, "why": "200 is the default for `spark.sql.shuffle.partitions`; for 3 GB that creates many tiny tasks whose scheduling overhead outweighs their work. Fewer shuffle partitions, or AQE's automatic coalescing, fixes that. `spark.default.parallelism` applies to RDD operations, not DataFrame shuffles. Driver memory and disabling broadcast joins don't address task overhead.", "refs": [["Spark SQL performance tuning", "https://spark.apache.org/docs/latest/sql-performance-tuning.html"], ["Spark properties on serverless", "https://docs.databricks.com/aws/en/spark/conf"]], "id": 35}, {"d": 3, "obj": "Deduplication", "q": "A bronze CDC feed contains several versions of each customer, with an `updated_at` timestamp. Silver must keep exactly the latest version of each `customer_id`, with all columns, and the result must be deterministic. Which approach is correct?", "opts": ["`df.dropDuplicates([\"customer_id\"])`, which keeps the first row it encounters per key", "Number rows with `row_number()` over a window by `customer_id`, newest `updated_at` first, and keep row 1", "`df.orderBy(F.desc(\"updated_at\")).dropDuplicates([\"customer_id\"])` so the newest row comes first", "`df.groupBy(\"customer_id\").agg(F.max(\"updated_at\"))`, then write the result to silver"], "a": 1, "why": "A window with `row_number()` ranks versions within each key explicitly, so the latest row is always chosen (add a tie-breaker column if timestamps can collide). `dropDuplicates` keeps an arbitrary row per key, and a preceding `orderBy` isn't guaranteed to survive the shuffle. The `groupBy`/`max` version returns only the key and the timestamp, losing the other columns.", "refs": [["pyspark.sql.Window", "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.Window.html"]], "id": 36}, {"d": 7, "obj": "ABAC policies for row filtering and column masking", "q": "A catalog has about 400 tables, and new ones are created every week. Any column holding a social security number must be masked for analysts. Which approach scales and covers tables created in future?", "opts": ["Run `ALTER TABLE ... ALTER COLUMN ... SET MASK` on each table and add it to the creation checklist", "Tag the columns with a governed tag and create one catalog-level ABAC column-mask policy that matches it", "Create a masked view for every table and revoke analysts' access to the base tables", "Copy the tables nightly into a separate catalog with the SSN values hashed"], "a": 1, "why": "An ABAC policy defined at catalog (or schema) level applies to current and future tables whose columns match the tag condition, so governance follows the tag rather than each table. Per-table masks and per-table views depend on people remembering to add them. Nightly copies duplicate data and lag behind the source. ABAC needs serverless compute or Databricks Runtime 16.4 or later.", "refs": [["Unity Catalog ABAC policies", "https://docs.databricks.com/aws/data-governance/unity-catalog/abac/policies"]], "id": 37}, {"d": 3, "obj": "Gold objects: materialized views, views, streaming tables, tables", "q": "A BI dashboard needs daily revenue by region from a 3-billion-row silver table that receives updates and deletes. Results should be precomputed so dashboard queries are fast, and refreshed on a schedule, incrementally where possible. Which gold object should the engineer create in Unity Catalog?", "opts": ["A standard view over the silver table", "A streaming table that reads the silver table with `STREAM`", "A temporary view created in the dashboard's notebook", "A materialized view"], "a": 3, "why": "A materialized view stores precomputed results and refreshes them, incrementally when the query and source allow it. A view stores nothing and recomputes the aggregation on every dashboard query. A streaming table expects an append-only source, and updates and deletes in silver break that model. A temporary view lasts only for one session.", "refs": [["Lakeflow Spark Declarative Pipelines", "https://docs.databricks.com/aws/en/ldp/"]], "id": 38}, {"d": 3, "obj": "Broadcast joins and spark.sql.autoBroadcastJoinThreshold", "q": "A 2 TB fact table is joined to a 40 MB store dimension. The query plan shows a SortMergeJoin with a large shuffle of the fact table. The cluster uses default settings. What is the most direct way to avoid shuffling the fact table?", "opts": ["Increase `spark.sql.shuffle.partitions` to 2000 so each shuffle task is smaller", "Set `spark.sql.autoBroadcastJoinThreshold` to `-1` so the optimizer picks the join", "Wrap the dimension in `F.broadcast(dim_store)` in the join", "Repartition both DataFrames on `store_id` before the join so rows are co-located"], "a": 2, "why": "The default broadcast threshold is 10 MB, so a 40 MB table isn't broadcast automatically. A broadcast hint (or a higher threshold) ships the small table to every executor and the fact table is never shuffled. Setting the threshold to `-1` disables broadcasting. More shuffle partitions or a manual repartition still shuffle 2 TB.", "refs": [["Spark SQL performance tuning", "https://spark.apache.org/docs/latest/sql-performance-tuning.html"]], "id": 39}, {"d": 6, "obj": "Out-of-memory, startup and library issues", "q": "A notebook runs the code below on a classic cluster and fails with an error saying the Spark driver stopped unexpectedly. `main.silver.events` holds about 400 million rows. What is the right fix?", "code": "rows = spark.table(\"main.silver.events\").collect()\npdf = pd.DataFrame(rows)\nsummary = pdf.groupby(\"event_type\").size()", "lang": "python", "opts": ["Increase `spark.executor.memory` so each executor can hold more rows", "Increase `spark.sql.shuffle.partitions` to spread the rows out", "Aggregate in Spark with `groupBy(\"event_type\").count()` and collect only that", "Add more worker nodes so the collect finishes in parallel"], "a": 2, "why": "`collect()` pulls all 400 million rows into driver memory, so the driver runs out of memory. Keeping the aggregation distributed returns only a handful of rows. Executor memory, shuffle partitions and extra workers don't change what lands on the driver. A larger driver would only postpone the failure.", "refs": [["Spark SQL performance tuning", "https://spark.apache.org/docs/latest/sql-performance-tuning.html"]], "id": 40}, {"d": 7, "obj": "Managed vs external tables", "q": "An engineer runs `DROP TABLE main.ref.fx_rates`. Afterwards the table no longer appears in Catalog Explorer, but its data files are still in the cloud storage path. Why?", "opts": ["The table was managed; Unity Catalog deletes managed files only after 30 days", "`DROP TABLE` needs a `PURGE` clause before it deletes any files", "The compute lacked the `WRITE FILES` privilege on the storage location", "The table was external, so `DROP TABLE` removed only its metadata"], "a": 3, "why": "For external tables, Unity Catalog manages only the metadata, so `DROP TABLE` leaves the files in place. For managed tables, Unity Catalog also removes the underlying data; a dropped managed table can be recovered with `UNDROP` for a limited period (7 days at the time of writing).", "refs": [["Convert external tables to managed", "https://docs.databricks.com/aws/en/tables/convert-external-managed"]], "id": 41}, {"d": 5, "obj": "Databricks CLI in automated CI/CD", "q": "A CI stage that runs on every pull request must catch bundle configuration errors, such as invalid keys or unresolved variables, without deploying anything. Which command belongs in that stage?", "opts": ["`databricks bundle sync -t prod`", "`databricks bundle validate -t prod`", "`databricks bundle run -t prod`", "`databricks bundle destroy -t dev`"], "a": 1, "why": "`bundle validate` checks the configuration for a target and resolves variables without changing the workspace. `sync` uploads files, `run` starts a deployed job or pipeline, and `destroy` removes deployed resources; all of these change state.", "refs": [["Bundle commands", "https://docs.databricks.com/aws/en/dev-tools/cli/bundle-commands"]], "id": 42}, {"d": 7, "obj": "GRANT and REVOKE at the right level of the hierarchy", "q": "Group `data_eng` needs to create tables in schema `sales.silver` and should get nothing more. It currently has no privileges on the `sales` catalog. Which statements grant exactly what is needed?", "opts": ["`GRANT CREATE TABLE ON SCHEMA sales.silver TO data_eng;`", "`GRANT ALL PRIVILEGES ON CATALOG sales TO data_eng;`", "`GRANT USE CATALOG ON CATALOG sales TO data_eng; GRANT USE SCHEMA, CREATE TABLE ON SCHEMA sales.silver TO data_eng;`", "`GRANT MODIFY ON SCHEMA sales.silver TO data_eng;`"], "a": 2, "why": "Creating a table needs `USE CATALOG` on the parent catalog, `USE SCHEMA` on the schema and `CREATE TABLE` on the schema. `CREATE TABLE` alone fails because the group can't reach the schema. `ALL PRIVILEGES` on the catalog grants far more than required. `MODIFY` allows changing data in existing tables, not creating new ones.", "refs": [["Manage Unity Catalog privileges", "https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/"]], "id": 43}, {"d": 6, "obj": "Job run history vs historical baselines", "q": "A five-task job has taken 18 to 22 minutes for months, but every run this week took about 50 minutes. Where should the engineer start to find which task regressed?", "opts": ["The event log of the team's all-purpose cluster for the week", "A rerun on a cluster twice the size, then a comparison of timings", "The job's run history, comparing per-task durations with earlier runs", "`DESCRIBE HISTORY` on each output table to compare commit times"], "a": 2, "why": "The Runs view shows run history with per-task durations, so a task whose time jumped this week stands out against its baseline. A larger rerun changes two variables at once. `DESCRIBE HISTORY` shows table commits, not task timing. An all-purpose cluster's event log isn't where a job's runs are recorded.", "refs": [["Lakeflow Jobs", "https://docs.databricks.com/aws/en/jobs/"]], "id": 44}];
const SECTIONS = [{"n": 1, "name": "Databricks Intelligence Platform", "w": 6, "count": 3}, {"n": 2, "name": "Data Ingestion and Loading", "w": 21, "count": 9}, {"n": 3, "name": "Data Transformation and Modeling", "w": 22, "count": 10}, {"n": 4, "name": "Working with Lakeflow Jobs", "w": 16, "count": 7}, {"n": 5, "name": "Implementing CI/CD", "w": 10, "count": 4}, {"n": 6, "name": "Troubleshooting, Monitoring, and Optimization", "w": 10, "count": 5}, {"n": 7, "name": "Governance and Security", "w": 15, "count": 7}];
const EXAM_MIN = 90, PASS = 0.70, KEY = "dea-mock-may2026-v1";
const L = ["A","B","C","D"];
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));

let S = load() || null;
let tick = null, pendingConfirm = null, filter = "all";

function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.v === 1 ? s : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function clearSaved(){ try { localStorage.removeItem(KEY); } catch(e){} }

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rich(t){ return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
const $ = s => document.querySelector(s);

function newRun(mode){
  S = { v:1, mode, order: BANK.map(q => q.id), cur:0, answers:{}, flags:{}, checked:{}, startedAt: Date.now(), submittedAt: null };
  save(); render();
}
function elapsed(){ return ((S.submittedAt || Date.now()) - S.startedAt) / 1000; }
function remaining(){ return EXAM_MIN*60 - elapsed(); }

function render(){
  clearInterval(tick); tick = null;
  if (!S) return renderStart();
  if (S.submittedAt) return renderResults();
  renderExam();
  tick = setInterval(updateTimer, 1000);
}

/* ---------- Start ---------- */
function renderStart(){
  const rows = SECTIONS.map(s => `<tr><td>${s.n}. ${esc(s.name)}<div class="wbar"><i style="width:${s.w*4}%"></i></div></td><td class="n">${s.w}%</td><td class="n">${s.count}</td></tr>`).join("");
  const saved = load();
  $("#app").innerHTML = `
  <div class="wrap">
    <header class="hero">
      <span class="label">Mock exam · Databricks Certified Data Engineer Associate</span>
      <h1>Data Engineer Associate, full-length mock</h1>
      <div class="meta"><span>Blueprint <b>May 4, 2026</b></span><span><b>45</b> scored questions</span><span><b>90</b> minutes</span><span>Single answer, <b>4</b> options</span><span>SQL first, Python otherwise</span></div>
    </header>
    ${saved && !saved.submittedAt ? `<div class="resume"><p><b>Attempt in progress.</b> ${saved.mode === "exam" ? "Timed exam" : "Practice"} mode, ${Object.keys(saved.answers).length} of 45 answered.</p><button class="btn primary" id="resume">Resume</button></div>` : ""}
    ${saved && saved.submittedAt ? `<div class="resume"><p><b>Last attempt submitted.</b> Review your results or start again.</p><button class="btn primary" id="viewres">View results</button></div>` : ""}
    <div class="start-grid">
      <section class="panel">
        <h2>How this mock maps to the exam guide</h2>
        <p class="muted" style="margin-top:6px;font-size:14px">Question counts follow the published section weights (45 × weight, rounded). Questions are mixed across sections, as on the real exam.</p>
        <div style="overflow-x:auto;margin-top:14px"><table class="bp tnum">
          <thead><tr><th>Section</th><th class="n">Weight</th><th class="n">Qs</th></tr></thead>
          <tbody>${rows}<tr><td>Total</td><td class="n">100%</td><td class="n">45</td></tr></tbody>
        </table></div>
      </section>
      <section style="display:grid;gap:20px;align-content:start">
        <div class="modes">
          <button class="mode" id="m-exam"><span class="t">Timed exam <span>90:00 countdown</span></span><span class="muted" style="font-size:14px">No feedback until you submit. Flag questions and return to them, as in the proctored exam. Auto-submits at zero.</span></button>
          <button class="mode" id="m-prac"><span class="t">Practice <span>untimed</span></span><span class="muted" style="font-size:14px">Check each answer as you go and read the explanation before moving on.</span></button>
        </div>
        <div id="startConfirm"></div>
        <div class="panel">
          <h3>Read before you start</h3>
          <ul class="notes" style="margin-top:10px">
            <li><b>Pass mark is not published</b> in the May 2026 guide. This page uses 70% as a target line only.</li>
            <li>The real exam can include <b>unscored items</b>, with extra time allowed for them, so your form may be longer than 45.</li>
            <li>Style is calibrated on the five retired sample questions in the <a href="https://www.databricks.com/sites/default/files/2026-05/databricks-certified-data-engineer-associate-exam-guide-may-2026-000.pdf" target="_blank" rel="noopener">official exam guide</a>. None of them is reproduced here; take them as a separate warm-up.</li>
            <li>Facts were checked against Databricks docs on 23 Oct 2026. Beta features (ABAC, ABAC DENY policies) can change.</li>
            <li>Keys: <span class="kbd">A–D</span> select, <span class="kbd">←/→</span> move, <span class="kbd">F</span> flag.</li>
          </ul>
        </div>
      </section>
    </div>
    <footer><span>Unofficial practice material. Not affiliated with or endorsed by Databricks. Progress is saved in this browser only.</span></footer>
  </div>`;
  const go = mode => {
    if (saved && !saved.submittedAt){
      $("#startConfirm").innerHTML = `<div class="inline-confirm"><p>Starting a new attempt discards the one in progress.</p><button class="btn" id="cNo">Keep it</button><button class="btn primary" id="cYes">Start new</button></div>`;
      $("#cNo").onclick = () => $("#startConfirm").innerHTML = "";
      $("#cYes").onclick = () => newRun(mode);
    } else newRun(mode);
  };
  $("#m-exam").onclick = () => go("exam");
  $("#m-prac").onclick = () => go("practice");
  if ($("#resume")) $("#resume").onclick = () => { S = saved; render(); };
  if ($("#viewres")) $("#viewres").onclick = () => { S = saved; render(); };
}

/* ---------- Exam ---------- */
function renderExam(){
  const q = byId[S.order[S.cur]], n = S.cur + 1, chosen = S.answers[q.id];
  const practice = S.mode === "practice", checked = practice && S.checked[q.id];
  const answered = Object.keys(S.answers).length;
  const opts = q.opts.map((o,i) => {
    let cls = "opt";
    if (checked){ cls += " locked"; if (i === q.a) cls += " ok"; else if (i === chosen) cls += " no"; }
    else if (i === chosen) cls += " sel";
    return `<label class="${cls}"><input type="radio" name="opt" id="opt-${i}" value="${i}" ${i===chosen?"checked":""} ${checked?"disabled":""}><span class="bub">${L[i]}</span><span class="txt">${rich(o)}</span></label>`;
  }).join("");
  const cells = S.order.map((id,i) => `<button class="cell${S.answers[id]!==undefined?" ans":""}${S.flags[id]?" flag":""}${i===S.cur?" cur":""}" data-i="${i}" aria-label="Question ${i+1}${S.answers[id]!==undefined?", answered":""}${S.flags[id]?", flagged":""}">${i+1}</button>`).join("");
  $("#app").innerHTML = `
  <div class="bar"><div class="bar-in">
    <span class="name">DE ASSOCIATE · MOCK</span><span class="mode-tag">${practice ? "practice" : "timed exam"}</span>
    <span class="spacer"></span>
    <span class="muted tnum" style="font-size:13px">${answered}/45 answered</span>
    <span class="timer tnum" id="timer" aria-live="off"></span>
  </div><div class="prog"><i style="width:${answered/45*100}%"></i></div></div>
  <div class="wrap" style="padding-top:0">
    <div class="exam">
      <main>
        <div class="qhead">
          <span class="qno">Question ${n} <span>of 45</span></span>
          <button class="btn ${S.flags[q.id]?"flagged":"ghost"}" id="flag" aria-pressed="${!!S.flags[q.id]}">${S.flags[q.id] ? "Flagged for review" : "Flag for review"}</button>
        </div>
        <p class="stem">${rich(q.q)}</p>
        ${q.code ? `<pre class="code"><span class="lang">${esc(q.lang)}</span>${esc(q.code)}</pre>` : ""}
        <div class="opts" role="radiogroup" aria-label="Answer options">${opts}</div>
        ${checked ? explainBlock(q, chosen) : ""}
        <div class="qnav">
          <button class="btn" id="prev" ${S.cur===0?"disabled":""}>← Previous</button>
          ${practice && !checked ? `<button class="btn primary" id="check" ${chosen===undefined?"disabled":""}>Check answer</button>` : ""}
          <button class="btn ${practice && !checked ? "" : "primary"}" id="next" ${S.cur===44?"disabled":""}>Next →</button>
          <span class="spacer"></span>
          <span class="kbd">A–D · ←/→ · F</span>
        </div>
      </main>
      <aside class="sheet" aria-label="Answer sheet">
        <div class="sheet-head"><span class="label">Answer sheet</span><span class="muted tnum" style="font-size:13px">${Object.values(S.flags).filter(Boolean).length} flagged</span></div>
        <div class="grid">${cells}</div>
        <div class="legend"><span><i></i>Open</span><span><i class="l-ans"></i>Answered</span><span><i class="l-flag"></i>Flagged</span></div>
        <button class="btn primary" id="submit">${practice ? "Finish and see results" : "Submit exam"}</button>
        <div id="subConfirm"></div>
        <button class="btn ghost" id="quit" style="margin-top:8px">Back to start</button>
      </aside>
    </div>
  </div>`;
  updateTimer();
  document.querySelectorAll('input[name="opt"]').forEach(r => r.onchange = () => choose(+r.value));
  document.querySelectorAll(".cell").forEach(c => c.onclick = () => go(+c.dataset.i));
  $("#prev").onclick = () => go(S.cur-1);
  $("#next").onclick = () => go(S.cur+1);
  $("#flag").onclick = toggleFlag;
  if ($("#check")) $("#check").onclick = () => { S.checked[q.id] = true; save(); renderExam(); };
  $("#submit").onclick = askSubmit;
  $("#quit").onclick = () => { S = null; render(); };
}
function choose(i){ const q = byId[S.order[S.cur]]; if (S.mode==="practice" && S.checked[q.id]) return; S.answers[q.id] = i; save(); renderExam(); }
function go(i){ if (i<0||i>44) return; S.cur = i; save(); renderExam(); window.scrollTo({top:0}); }
function toggleFlag(){ const id = S.order[S.cur]; S.flags[id] = !S.flags[id]; save(); renderExam(); }
function askSubmit(){
  const open = 45 - Object.keys(S.answers).length, fl = Object.values(S.flags).filter(Boolean).length;
  const msg = open || fl ? `${open} unanswered and ${fl} flagged. Unanswered questions score zero.` : "All 45 answered.";
  $("#subConfirm").innerHTML = `<div class="inline-confirm"><p>${msg} Submit now?</p><button class="btn" id="sNo">Keep going</button><button class="btn primary" id="sYes">Submit</button></div>`;
  $("#sNo").onclick = () => $("#subConfirm").innerHTML = "";
  $("#sYes").onclick = submit;
}
function submit(){ S.submittedAt = Math.min(Date.now(), S.mode==="exam" ? S.startedAt + EXAM_MIN*60000 : Date.now()); save(); render(); window.scrollTo({top:0}); }
function updateTimer(){
  const t = $("#timer"); if (!t || !S || S.submittedAt) return;
  if (S.mode === "exam"){
    const r = remaining(); t.textContent = fmt(r); t.classList.toggle("low", r < 600);
    if (r <= 0) submit();
  } else t.textContent = fmt(elapsed());
}
function explainBlock(q, chosen){
  const ok = chosen === q.a;
  return `<div class="explain ${ok?"ok":"no"}">
    <span class="verdict">${chosen===undefined ? "Not answered" : ok ? "Correct" : "Incorrect"} · answer ${L[q.a]}</span>
    <p>${rich(q.why)}</p>
    <p class="objective">Section ${q.d}: ${esc(SECTIONS[q.d-1].name)} · ${esc(q.obj)}</p>
    <div class="refs">${q.refs.map(r => `<a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])} ↗</a>`).join("")}</div>
  </div>`;
}

/* ---------- Results ---------- */
function renderResults(){
  const res = S.order.map((id,i) => { const q = byId[id], c = S.answers[id]; return {q, i, c, ok: c === q.a, skip: c === undefined}; });
  const score = res.filter(r => r.ok).length, pct = score/45;
  const secs = SECTIONS.map(s => { const rs = res.filter(r => r.q.d === s.n); const k = rs.filter(r => r.ok).length; return {...s, k, t: rs.length, p: k/rs.length}; });
  const weak = secs.filter(s => s.p < PASS).sort((a,b) => (a.p - b.p) || (b.w - a.w));
  const secRows = secs.map(s => {
    const col = s.p >= PASS ? "var(--good)" : "var(--bad)";
    return `<div class="sec tnum"><span>${s.n}. ${esc(s.name)} <span class="muted">· ${s.w}%</span></span><span class="track" role="img" aria-label="${s.k} of ${s.t} correct"><i style="width:${s.p*100}%;background:${col}"></i><b style="left:${PASS*100}%"></b></span><span style="text-align:right;font-family:var(--f-mono);font-size:13px">${s.k}/${s.t}</span></div>`;
  }).join("");
  const used = elapsed();
  const fchips = [["all","All 45"],["wrong","Incorrect or skipped"],["flag","Flagged"]].concat(SECTIONS.map(s => ["s"+s.n, "S"+s.n])).map(([k,t]) => `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${t}</button>`).join("");
  const list = res.filter(r => filter==="all" || (filter==="wrong" && !r.ok) || (filter==="flag" && S.flags[r.q.id]) || filter==="s"+r.q.d).map(r => {
    const opts = r.q.opts.map((o,i) => `<div class="opt locked${i===r.q.a?" ok":(i===r.c?" no":"")}"><span class="bub">${L[i]}</span><span class="txt">${rich(o)}</span></div>`).join("");
    return `<details class="rv"><summary><span class="mark ${r.skip?"skip":r.ok?"ok":"no"}">${r.i+1}</span><span class="s">${esc(r.q.q.replace(/`/g,""))}</span><span class="sec-tag">S${r.q.d}${S.flags[r.q.id]?" · flagged":""}</span></summary>
      <div class="body"><p class="stem" style="font-size:15.5px">${rich(r.q.q)}</p>${r.q.code?`<pre class="code"><span class="lang">${esc(r.q.lang)}</span>${esc(r.q.code)}</pre>`:""}<div class="opts" style="margin-top:12px">${opts}</div>${explainBlock(r.q, r.c)}</div></details>`;
  }).join("") || `<p class="muted">Nothing matches this filter.</p>`;
  $("#app").innerHTML = `
  <div class="wrap">
    <span class="label">Results · ${S.mode === "exam" ? "timed exam" : "practice"} · ${fmt(used)} used</span>
    <div class="score" style="margin-top:10px">
      <div class="big tnum">${Math.round(pct*100)}%<small>${score}/45</small></div>
      <div style="display:grid;gap:10px">
        <span><span class="verdict-pill ${pct>=PASS?"ok":"no"}">${pct>=PASS ? "Above the 70% target" : "Below the 70% target"}</span></span>
        <p class="muted" style="max-width:60ch;font-size:14.5px">${weak.length ? `Weakest sections first: ${weak.map(s => `S${s.n} ${esc(s.name)} (${s.k}/${s.t})`).join("; ")}. Section weight matters as much as the miss rate, so fix the heavy sections first.` : "Every section is at or above the target line."}</p>
      </div>
    </div>
    <div style="margin-top:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2>By section</h2><span class="muted" style="font-size:13px">Tick marks the 70% target line</span></div>
    <div class="sec-list" style="margin-top:14px">${secRows}</div>
    <div class="filters" role="group" aria-label="Filter review">${fchips}</div>
    <div id="list">${list}</div>
    <div class="qnav"><button class="btn primary" id="again">Start a new attempt</button><span id="againConfirm"></span></div>
    <footer><span>Unofficial practice material. Not affiliated with or endorsed by Databricks. Exam facts from the May 4, 2026 exam guide and Databricks docs as of 23 Oct 2026.</span></footer>
  </div>`;
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { filter = c.dataset.f; renderResults(); });
  $("#again").onclick = () => { clearSaved(); S = null; filter = "all"; render(); };
}

document.addEventListener("keydown", e => {
  if (!S || S.submittedAt || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["INPUT","TEXTAREA"].includes(e.target.tagName) && e.target.type !== "radio") return;
  const k = e.key.toLowerCase(), idx = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3}[k];
  if (idx !== undefined) { choose(idx); e.preventDefault(); }
  else if (e.key === "ArrowRight") { go(S.cur+1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { go(S.cur-1); e.preventDefault(); }
  else if (k === "f") { toggleFlag(); }
});
render();
</script>
